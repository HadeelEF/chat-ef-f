# Memories (#108): after each reply a memory agent on the fast model (`Qwen Tasks`: no search, which needs a streamed
# call, and the memory agent's call is not streamed) updates what the user asked it to keep; the user
# sees, edits and switches them off in the side menu and in Settings → Personalization. Recent messages go to the
# approved provider (#5) for this; nothing leaves it. v0.8.8 runs the agent only with `enabled: true` (without it,
# memories are added by hand only).
memory:
  personalize: true
  messageWindowSize: 5
  tokenLimit: 2000
  agent:
    enabled: true
    provider: 'Qwen Tasks'
    model: 'qwen3.8-flash'

# Long chats (#129): when the history no longer fits the model's context window, v0.8.8 drops the oldest messages; with
# summarization they are replaced by a summary instead, and the context gauge offers «ضغط السياق» (compact now). No
# `trigger`: the summary is written only when messages would otherwise be dropped (or on request), so nothing extra is
# sent before that. The fast model without thinking or search writes it (provider = the endpoint's name, so its key,
# base URL and `addParams` apply). Arabic prompts replace upstream's English ones, whose English headings the employee
# would see; plain text, because the «تم تلخيص المحادثة» box shows the summary as written (Markdown «##» would show as
# is).
summarization:
  enabled: true
  provider: 'Qwen Tasks'
  model: 'qwen3.8-flash'
  prompt: |-
    توقّف قبل أن تكمل: اكتب ملخصاً يحلّ محل الرسائل السابقة، لأن سياق المحادثة اقترب من حدّه. اكتبه بلغة المحادثة نفسها،
    بما فيها العناوين، واجمع فيه كل ما تحتاجه لتكمل من حيث توقفت. لا تُعِد تقييم ما جرى ولا تتحقق منه، ونتائج الأدوات تعكس ما
    حدث فعلاً. اكتب الملخص وحده، ولا ترد على المستخدم ولا تكمل المحادثة. واكتبه نصاً عادياً بلا رموز Markdown: كل عنوان في
    سطر ينتهي بنقطتين، والبنود أسطر تبدأ بشَرطة.

    الهدف:
    ما طلبه المستخدم، وأي أهداف فرعية.

    القيود والتفضيلات:
    ما حدده المستخدم من قواعد وتفضيلات: اللغة والنبرة والصيغة والجهة المقصودة وغيرها.

    ما أُنجز:
    - ما اكتمل ونتيجته.

    ما زال جارياً:
    - ما يجري العمل عليه الآن.

    القرارات:
    ما اتُّخذ من قرارات وسببها.

    الخطوات التالية:
    ما تبقّى، بالترتيب.

    تفاصيل تُحفظ حرفياً:
    الأسماء والأرقام والتواريخ والروابط ونصوص الأخطاء كما وردت.

    القواعد:
    - جمل قصيرة وواضحة.
    - احفظ الأسماء والأرقام والمراجع حرفياً.
    - احذف الأقسام الفارغة.
  updatePrompt: |-
    توقّف مرة أخرى وحدّث ملخصك: ادمج الرسائل الجديدة في الملخص السابق، واكتب ملخصاً واحداً موحّداً يحلّ محله، بلغة المحادثة
    نفسها. اجعله قريباً من طول الملخص السابق: اختصر التفاصيل القديمة لتفسح مكاناً للجديد، ولا تكتفِ بالإضافة في آخره. أعطِ ما جرى
    مؤخراً تفصيلاً أكثر، واختصر القديم إلى سطر واحد لكل بند. لا تتحقق مما جرى ولا تُعِد تقييمه. اكتب الملخص وحده، ولا ترد على
    المستخدم ولا تكمل المحادثة. واكتبه نصاً عادياً بلا رموز Markdown، بالعناوين نفسها.

    القواعد:
    - ادمج الجديد في أقسامه، ولا تكرر العناوين.
    - اختصر كل بند مكتمل قديم في سطر واحد.
    - انقل ما اكتمل من «ما زال جارياً» إلى «ما أُنجز».
    - حدّث «الخطوات التالية» بحسب ما تبقّى الآن.
    - احفظ الأسماء والأرقام والمراجع حرفياً.
    - احذف الأقسام الفارغة.

# Sensitive data (#129; footer: «لا تُدخل معلومات سرية أو بيانات شخصية»): a message, an answer to a clarifying
# question, or a file's extracted text that matches one of these patterns is refused before it reaches the model or the
# database, and the employee is told which kind of data to remove (label; patch 0019 shows it in Arabic).
#   - A Saudi national ID or iqama number: 10 digits starting with 1 or 2, Western, Arabic-Indic or Persian digits. A
#     10-digit amount such as 1500000000 matches too: written with separators (1,500,000,000) it passes.
#   - A Saudi IBAN: SA, 2 check digits and 20 characters, with or without spaces or hyphens.
#   - API keys and tokens: upstream's starter patterns are switched off (`starterPatterns: []`) because they match
#     ordinary words («To the bearer of this letter», «sk-1»); these require a token of 16 or more characters.
# RE2 syntax: no lookaround, so a pattern consumes the character next to the number. Model replies are not inspected
# (`unattributedAssistantContent` default). Files the parser cannot read (images) stay allowed (`uninspectable`
# default): there is no text to check. Not inspected either: prompts, agents, skills and memories the employee writes
# (each is its own `filters` source with its own refusal screen, untested).
filters:
  messages:
    pii:
      action: block
      starterPatterns: []
      customPatterns: &sensitive
        - id: sa_national_id
          label: 'رقم هوية وطنية أو إقامة'
          regex: '(?:^|[^0-9٠-٩۰-۹])[12١٢۱۲][0-9٠-٩۰-۹]{9}(?:[^0-9٠-٩۰-۹]|$)'
        - id: sa_iban
          label: 'رقم آيبان سعودي'
          regex: '(?i)(?:^|[^0-9A-Z])SA ?[0-9]{2}(?:[ -]?[0-9A-Z]{4}){5}(?:[^0-9A-Z]|$)'
        - id: secret_key
          label: 'مفتاح API'
          category: credential
          regex: '(?i)(?:\bsk-[A-Za-z0-9_-]{16,}|\b(?:x-)?api[-_]?key\s*[:=]\s*["'']?[A-Za-z0-9._-]{16,})'
        - id: bearer_token
          label: 'رمز دخول (Bearer)'
          category: credential
          regex: '(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{20,}'
  files:
    pii:
      action: block
      fields: ['content', 'extracted_text']
      starterPatterns: []
      customPatterns: *sensitive

# Uploads (#129, FR-007 AC-1): files go to the private volume (Railway `librechat-storage`, 5 GB; Compose
# `librechat-uploads`). Upstream allows 512 MB per file; these limits keep one upload from filling the volume.
# The paperclip sends each file one way (`defaultLLMDeliveryPath`). Upstream sends Word and Excel as text, read by the
# built-in parser (the `context` capability; no RAG or OCR service), but a PDF as the file itself (base64 `file` part):
# the sensitive-data filter cannot read that, so a PDF with an ID number reached the model (tested), and whether Qwen
# reads such a part is unverified. PDFs go as extracted text too. A scanned PDF has no text layer and is refused (no
# OCR). Images still go to the model as images.
fileConfig:
  serverFileSizeLimit: 20
  defaultLLMDeliveryPath:
    overrides:
      'application/pdf': 'text'
  # A custom endpoint (the Qwen ones) takes the `agents` entry, which upstream fills with 512 MB, before `default`
  # (getEndpointFileConfig): without it the browser let a 22 MB file through and the server answered «unknown error».
  endpoints:
    default: &upload_limits
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 50
    agents: *upload_limits

# Keep `endpoints` the LAST top-level key and `custom` its LAST child: tests/integration/mock_chat.py appends its
# test-only mock endpoints to the `custom` list.
endpoints:
  # Every chat in v0.8.8 runs on the agents runtime (POST /api/agents/chat/<endpoint>), also for custom endpoints, so
  # this block applies to all model calls. The agents permission above controls the endpoint and the builder.
  agents:
    disableBuilder: false
    # Capabilities that work with what this deployment has (#108). Not listed, until their own decision:
    # execute_code (LibreChat Code API key + egress), file_search (no RAG API service), web_search (no search keys),
    # actions (server-side HTTP to any host), ocr (no OCR provider). React artifacts render through the hosted Sandpack
    # bundler (an external origin) until SANDPACK_BUNDLER_URL points to a self-hosted one: a production gate; the other
    # types preview in a local sandboxed frame (patch 0029, #167).
    capabilities: ['artifacts', 'context', 'skills', 'memory', 'tools', 'chain', 'subagents', 'deferred_tools',
                   'ask_user_question', 'file_search']
    # Provider error text is not stored or shown to users (it can contain gateway pages or internal host names);
    # users get a generic message with the HTTP status. Details stay in the server log.
    maxProviderErrorChars: 0
    # Transport limits of every model call (#39), from live Qwen Cloud measurements on 2026-10-24 (38 synthetic
    # streamed calls over the six chat endpoints): headers arrive with the first token after 1.4–3.1 s, and chunks then
    # follow at most 3.1 s apart. A reply that stops streaming fails after 60 s of silence (default 15 min); the
    # header limit is a backstop above the endpoints' 20 s per-attempt `timeout` (default 5 min).
    modelResponseBodyTimeoutMs: 60000
    modelResponseHeadersTimeoutMs: 60000
  custom:
    # Qwen Cloud pay-as-you-go (#37): the documented OpenAI-compatible base URL (Singapore) for its `sk-ws-` API keys.
    # Seven endpoints share the account and key because thinking (#131) and search (#135, #138) are set per endpoint:
    # `enable_thinking`, `reasoning_effort`, `enable_search` and `search_options` go in `addParams`, so the server sets
    # them and the parameters panel cannot change them; the non-OpenAI ones are sent as top-level body fields (Qwen
    # Cloud's documented placement). Fixed lists (`fetch: false`): only the approved models are offered and accepted
    # (FR-002 AC-1). Retry/timeout (#39): one retry and 20 s per attempt until the response headers arrive. Measured
    # live (2026-10-24): headers come with the first token after 1.4–3.1 s, a 9k-token summary on «Qwen Tasks»
    # (not streamed) answers in 4.5 s. Neither is sent upstream.
    # Internet (owner decision 2026-10-22, #135, ADR-0015): the three chat endpoints have Qwen Cloud's built-in web
    # search, `turbo` strategy (its default; the model decides when to search, and each search is billed on the same
    # account). The OpenAI-compatible API returns no source list, so the instructions above ask the model to name its
    # sources. Qwen Cloud searches only in streamed calls, and chats stream.
    # Titles, memories and summaries of every chat (#135): the fast model with neither thinking nor search, because
    # those calls are not all streamed. No spec points here: employees never pick it.
    - name: 'Qwen Tasks'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['qwen3.8-flash']
        fetch: false
      titleConvo: true
      titleModel: 'qwen3.8-flash'
      modelDisplayLabel: 'بصير'
      addParams:
        enable_thinking: false
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi', 'reasoning_effort']
    # «بصير لايت»: the fast model without thinking (qwen3.8-flash thinks by default, at its deepest level), with search.
    - name: 'Qwen'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['qwen3.8-flash']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      # Title instruction (#169): LibreChat takes it from the chat's endpoint, not from `titleEndpoint`; its default
      # asks for an English title in title case. `{convo}` is where LibreChat puts the first exchange.
      titlePrompt: &title_prompt |-
        اكتب عنواناً قصيراً لهذه المحادثة من خمس كلمات أو أقل، بلغة رسالة المستخدم:
        بالعربية إذا كتب بالعربية، وبالإنجليزية إذا كتب بالإنجليزية.
        بلا علامات ترقيم ولا علامات تنصيص ولا رموز. أعد العنوان وحده.

        المحادثة:
        {convo}
      modelDisplayLabel: 'بصير'
      addParams:
        enable_thinking: false
        enable_search: true
        search_options: &search {search_strategy: 'turbo'}
        maxRetries: 1
        timeout: 20000
      # The parameters panel offers OpenAI-only switches that move the request to the Responses API (web search,
      # Responses API); with them every reply of that chat failed on Qwen Cloud (#120). Its reasoning-effort setting
      # is dropped too, so Lite never asks for thinking (#131).
      dropParams: ['web_search', 'useResponsesApi', 'reasoning_effort']
    # «بصير بلس» (#131): the same model with thinking at `medium` (its levels: low, medium, xhigh). Qwen Cloud asks for
    # the model's `reasoning_content` back with the tool results of the same reply (a clarifying question, #129):
    # `includeReasoningContent` replays it within a reply only, so the history sent with later messages does not grow.
    # LibreChat shows the streamed `reasoning_content` as a thinking block; titles go through `Qwen Tasks`.
    - name: 'Qwen Thinking'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['qwen3.8-flash']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      titlePrompt: *title_prompt
      modelDisplayLabel: 'بصير بلس'
      addParams:
        enable_thinking: true
        reasoning_effort: 'medium'
        enable_search: true
        search_options: *search
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi']
      customParams:
        includeReasoningContent: true
    # «بصير برو» (#131): DeepSeek V4.1 Flash, served by Qwen Cloud (same account, key and base URL; text and images in),
    # thinking at `high` (its default; low, high, max). LibreChat replays DeepSeek's `reasoning_content` on tool turns
    # by model name. The reply label comes from the spec («بصير برو»), never from the model name.
    - name: 'DeepSeek'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['deepseek-v4.1-flash-1017']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      titlePrompt: *title_prompt
      modelDisplayLabel: 'بصير برو'
      addParams:
        enable_thinking: true
        reasoning_effort: 'high'
        enable_search: true
        search_options: *search
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi']
    # No-search twins of the three chat endpoints (#138): the same models, thinking and limits, without
    # `enable_search`. The composer's internet switch moves a chat here through the hidden `-noweb` specs above.
    - name: 'Qwen NoWeb'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['qwen3.8-flash']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      titlePrompt: *title_prompt
      modelDisplayLabel: 'بصير'
      addParams:
        enable_thinking: false
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi', 'reasoning_effort']
    - name: 'Qwen Thinking NoWeb'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['qwen3.8-flash']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      titlePrompt: *title_prompt
      modelDisplayLabel: 'بصير بلس'
      addParams:
        enable_thinking: true
        reasoning_effort: 'medium'
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi']
      customParams:
        includeReasoningContent: true
    - name: 'DeepSeek NoWeb'
      apiKey: '${QWEN_API_KEY}'
      baseURL: 'https://maas.qwencloudapi.com/compatible-mode/v1'
      models:
        default: ['deepseek-v4.1-flash-1017']
        fetch: false
      titleConvo: true
      titleEndpoint: 'Qwen Tasks'
      titleModel: 'qwen3.8-flash'
      titlePrompt: *title_prompt
      modelDisplayLabel: 'بصير برو'
      addParams:
        enable_thinking: true
        reasoning_effort: 'high'
        maxRetries: 1
        timeout: 20000
      dropParams: ['web_search', 'useResponsesApi']
