# Windows 11 local development (Ubuntu WSL2 + Docker Engine) and any developer workstation or cloud session.
# Publishes LibreChat on the loopback interface only: http://localhost:3080, and the Admin Panel (ADR-0016) at
# http://localhost:3000. Nothing is reachable from the network.
# Usage (from this directory): docker compose -f compose.yaml -f compose.local.yaml up -d
#   Guide: docs/operations/windows-local.md
# Never use this file on a shared server: use compose.onprem.yaml (HTTPS reverse proxy) instead.
services:
  librechat:
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-3080}:3080"
  admin-panel:
    ports:
      - "127.0.0.1:${LOCAL_ADMIN_PORT:-3000}:3000"
    environment:
      # Plain HTTP on loopback only: browsers would drop a Secure session cookie.
      SESSION_COOKIE_SECURE: "false"
