# TEST-ONLY librechat.yaml fragment for the synthetic chat regression test (#38, #39). tests/integration/mock_chat.py
# appends the list items below to the `endpoints.custom` list of the shared infrastructure/common/librechat.yaml
# (`endpoints:` is its last top-level key and `custom:` the last child), so the test runs the shared policy unchanged.
# Not an approved provider (OD-01, #5) and never deployed: the base URLs resolve only inside the test stack.
# Schema: LibreChat v0.8.8 `endpoints.custom[]` (librechat.yaml version 1.3.17).
endpoints:
  custom:
    # Retry/timeout for the mock integration (#39): one retry and 8 s per attempt (until response headers), so an
    # HTTP 5xx is reported in seconds instead of after ~1–2 min of upstream default backoff (maxRetries 6). These are
    # test values, not approved provider limits: live values are decided with the provider (#37).
    - name: 'Baseer Mock'
      apiKey: '${MOCK_LLM_API_KEY}'
      baseURL: 'http://mock-llm:8080/v1'
      models:
        default: ['baseer-mock-echo', 'baseer-mock-slow', 'baseer-mock-error', 'baseer-mock-5xx', 'baseer-mock-429',
                  'baseer-mock-401', 'baseer-mock-gone', 'baseer-mock-hang', 'baseer-mock-stall', 'baseer-mock-markdown']
        fetch: false
      titleConvo: false
      addParams:
        maxRetries: 1
        timeout: 8000
      modelDisplayLabel: 'Baseer Mock'
    # Same key, closed port: every request fails at the network layer (connection refused); maxRetries 0 fails fast.
    - name: 'Baseer Mock Offline'
      apiKey: '${MOCK_LLM_API_KEY}'
      baseURL: 'http://mock-llm:9/v1'
      models:
        default: ['baseer-mock-echo']
        fetch: false
      titleConvo: false
      addParams:
        maxRetries: 0
      modelDisplayLabel: 'Baseer Mock Offline'
    # Many retries with exponential backoff (1–2, 2–4, 4–8, 8–16 s): used to prove that Stop ends a turn that is
    # waiting between retries, and that no further provider request is made after it.
    - name: 'Baseer Mock Retry'
      apiKey: '${MOCK_LLM_API_KEY}'
      baseURL: 'http://mock-llm:8080/v1'
      models:
        default: ['baseer-mock-5xx']
        fetch: false
      titleConvo: false
      addParams:
        maxRetries: 4
      modelDisplayLabel: 'Baseer Mock Retry'
